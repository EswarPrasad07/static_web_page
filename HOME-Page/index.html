<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    header{
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .img-logo{
      width: 180px;
    }
    .header-search-b{
      width: 30px;
      margin: 0px 10px 0px 10px
    }
    .header-search-img{
      width: 20px;
      margin: 0px 10px 0px 10px;

    }
    
    .header-profile-img{
      width: 28px;
      border-radius: 25px;
    }

    a{
      text-decoration: none;
      color: green;
      font-size: 18px;
      margin-left: 50px;
    }
   
    /* *****************section styling************** */
    section{
      width: 100%;
      height:460px;
     background-image: url("bgg.png");
     background-repeat: no-repeat;
     background-size:100% 460px ;
      position: relative;
    }
    section div{
      position: absolute;
      bottom: 120px;
      left: 130px;
    }
    .section-h1-1{
      font-family: Arial, Helvetica, sans-serif;
      color: green;
      font-size: 60px;
      margin: 0px;
    }
    .section-h1-2{
      font-family: Arial, Helvetica, sans-serif;
      font-size: 60px;
      margin: 0px;
      
    }
    section p{
      font-size: 20px;
      font-family: Arial, Helvetica, sans-serif;
    }
    section button{
      height: 50px;
      width: 100px;
      background-color: rgb(7, 162, 7);
      border: none;
      border-radius: 10px;
      color: white;
      
    }
    section button a{
      color: black;
      margin-left: 0px;
    }
    
      /* ***************************foooter part********* */
      
      .container{
        display: flex;
        justify-content: center;
        
      }
      .box{
        height: 130px;
        width: 160px;
        
        margin:0px 30px 0px 30px ;
      }
      .img{
        width: 110px;
        padding: 10px;
      }
      .box .img:hover{
        height: 132px;
      }
      /* ***************foot last************* */
      .foot-last{
        margin-top: 50px;
        height:60px;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        width: 100%;
        background-color: green;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .foot-last-div-p
      {
        margin-left: 100px;
      }
      .foot-last-p{
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
      }
      .foot-last-div-a{
        margin-right: 100px;
      }
      footer div a{
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        margin-left: 70px;
      }
       /* *******hidden menu*********** */
      .hidden-menu-img{
        width: 20px;
        border: none;
        cursor: pointer;
        display: none;
      }
      @media Screen and (max-width:600px){
        .header-menu-bar{
          display: none;
        }
        .hidden-menu-img{
          display: inline;
        }
        a{
          margin-left: 30px;
        }
        header{
          display: flex;
          justify-content: space-evenly;
        }
        section {
          position: relative;
        }
        section div{
          position: absolute;
          left: 80px;
        }
        .container{
          display: grid;
          grid-template-columns: auto auto;
        }
        .foot-last{
          display: flex;
          flex-direction: column;
          margin-top: 50px;
          align-items: center;
           height: 70px;
           width: 590px;
        }
      }
  </style>
</head>
<body style="margin: 0px;">
  <header>
     <div class="hidden-menu">

    <button><a href="../Shop-page/shop.html" target="_blank">Shop now</a></button>

      </div>

    <div class="foot-last">
      <div class="foot-last-div-p">
        <p class="foot-last-p">@2026 FreeCart All Rights Reserved.</p>
      </div>
      <div class="foot-last-div-a">

      </div>
    </div>
  </footer>
</body>
</html>
