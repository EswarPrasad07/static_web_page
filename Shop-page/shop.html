<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <style>
    header{
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow:0 2px 0px rgb(0, 0, 0,0.2) ;
     flex: 1;
     position: relative;
      
    }
    .img-logo{
      width: 180px;
    }
    .header-search-b{
      width: 30px;
      margin: 0px 10px 0px 10px
    }
    .header-search-img{
      width: 20px;
      margin: 0px 10px 0px 10px;

    }
    
    .header-profile-img{
      width: 28px;
      border-radius: 25px;
    }
    .header-cart{
      width: 28px;
      margin: 0px 20px 0px 20px;
    }

    a{
      text-decoration: none;
      color: green;
      font-size: 18px;
      margin-left: 20px;
    }
    .item-cart{
      width: 18px;
      height: 18px;
      background-color:red;
      position: absolute;
      top: 20px;
      right: 161px;
      text-align: center;
      border-radius: 9px;
      font-size:13px;
      
      

    }
    /* ************************section************************ */
    section{
      position: relative;
      background-color: rgb(211, 211, 211,0.2);
    }
    .section-side{
      width: 300px;
      height: 900px;
      padding-top:10px ;
      
    }
    .section-side-bar{
      height: 300px;
      width: 200px;
      /* border: 1px solid black; */
      margin-left: 50px;
      background-color: white;
      box-shadow: 0 4px 10px rgb(0, 0, 0,0.1);
      padding: 10px;
      
    }
    .sidebar-checkboxes{
      margin-left: 10px;
      margin-top: 10px;
      
    }
    .section-side-bar h3{
      margin-left: 10px;
    }
    /* ********************section-middle grid*************** */
    
    .section-middle{
      margin-left: 310px;
      position: absolute;
      top: 0px;
      
    }
    .grid{
      display: grid;
      grid-template-columns: auto auto auto auto;
      gap: 50px;
      
      padding-top: 20px;
      
    }
    .fruit-img{
      width: 200px;
    }
    .rating-img{
      width: 110px;
    }
    .cart-btn{
      width: 130px;
      height: 30px;
      background-color: green;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }
    .grid-box{
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border: 1px solid #ddd;
      border-radius: 10px;
      display: inline;
      padding: 20px;
      background-color: white;
    }

     /* *******hidden menu*********** */
      .hidden-menu-img{
        width: 20px;
        border: none;
        cursor: pointer;
        display: none;

      }
        @media Screen and (max-width:600px){
        .header-menu-bar{
          display: none;
        }
        .hidden-menu-img{
          display: inline;
        }
        header{
          display: flex;
          justify-content: space-evenly;

        }
        .section-side{
          display: none;
        }
        .section-middle{
          margin-left: 30px;
        }

        .grid{
         display: grid;
         grid-template-columns: auto auto;
        }
      }
    


  </style>
  <script>
    let c=0
    function add_cart()
    {
      c++
     document.getElementById("cart-id").innerHTML=c 
    }
    function reset_cart()
    {
      if (c>0){
         c--
      document.getElementById("cart-id").innerHTML=c
      }
     
    }
   
    
  </script>
</head>
